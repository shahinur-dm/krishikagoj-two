    <script>
      (function () {
        function checkMobile() {
          try {
            var screenMin = Math.min(window.screen.width, window.screen.height);
            var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            var isPhysicalMobile = isTouch && screenMin > 0 && screenMin < 600;
            if (isPhysicalMobile) {
              document.documentElement.classList.add('is-physical-mobile');
            } else {
              document.documentElement.classList.remove('is-physical-mobile');
            }
          } catch (e) {}
        }
        checkMobile();
        window.addEventListener('resize', checkMobile);
        window.addEventListener('orientationchange', checkMobile);
      })();
    </script>
